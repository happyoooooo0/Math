<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>线性代数课堂测试 · 1.4 Cayley–Hamilton 定理</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 60%, #faf5ff 100%);
  color: #0f172a;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.65;
}
.app {
  max-width: 760px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ===== Header ===== */
.hdr {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid #e2e8f0;
  padding: 12px 18px 10px;
  box-shadow: 0 1px 0 rgba(15, 23, 42, 0.02);
}
.hdr-title {
  font-size: 15px;
  font-weight: 600;
  color: #1e3a8a;
  letter-spacing: 0.3px;
}
.hdr-meta {
  display: flex;
  justify-content: space-between;
  font-size: 12.5px;
  color: #64748b;
  margin-top: 4px;
}
.hdr-meta .filled-good { color: #16a34a; font-weight: 500; }
.upload-tip {
  font-size: 12px; color: #64748b; text-align: center; margin-top: 8px; min-height: 16px;
}
.upload-tip.ok { color: #16a34a; }
.upload-tip.err { color: #b45309; }
.hdr-bar {
  margin-top: 8px;
  height: 4px;
  background: #e0e7ff;
  border-radius: 4px;
  overflow: hidden;
}
.hdr-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #3b82f6, #6366f1, #8b5cf6);
  width: 0%;
  transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ===== Main content ===== */
.main {
  flex: 1;
  padding: 18px 16px 110px;
}

/* ===== Question card ===== */
.q-card {
  background: white;
  border-radius: 18px;
  padding: 24px 22px;
  box-shadow: 0 4px 18px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.03);
  margin-bottom: 16px;
  display: none;
  animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.q-card.active { display: block; }
@keyframes slideIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.q-card.hidden { display: none; }
.q-section {
  font-size: 12.5px;
  color: #6366f1;
  font-weight: 600;
  letter-spacing: 0.4px;
  text-transform: none;
  margin-bottom: 8px;
}
.q-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px dashed #e2e8f0;
}
.q-title {
  font-size: 19px;
  font-weight: 700;
  color: #1e293b;
  margin: 0;
}
.q-points {
  font-size: 12px;
  font-weight: 600;
  color: #475569;
  background: #f1f5f9;
  padding: 4px 10px;
  border-radius: 8px;
}
.q-content {
  font-size: 15.5px;
  color: #334155;
}
.q-content p { margin: 14px 0; }
.q-content ul, .q-content ol {
  margin: 12px 0;
  padding-left: 22px;
}
.q-content li { margin: 4px 0; }
.q-content pre {
  background: #f8fafc;
  border-left: 3px solid #94a3b8;
  padding: 10px 14px;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 13.5px;
}
.q-content code {
  font-family: "SF Mono", Menlo, Consolas, monospace;
  background: #f1f5f9;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 13.5px;
}
.q-content table {
  border-collapse: collapse;
  margin: 12px 0;
  font-size: 14px;
}
.q-content table th, .q-content table td {
  border: 1px solid #e2e8f0;
  padding: 6px 10px;
  text-align: center;
}

/* ===== Blank input ===== */
.blank {
  display: inline-block;
  position: relative;
  margin: 0 3px;
}
.blank input {
  border: none;
  border-bottom: 2px solid #cbd5e1;
  background: #f8fafc;
  font-size: 15.5px;
  padding: 4px 12px;
  min-width: 90px;
  max-width: 240px;
  width: 140px;
  text-align: center;
  outline: none;
  transition: all 0.2s;
  font-family: inherit;
  border-radius: 6px 6px 0 0;
  color: #0f172a;
}
.blank input::placeholder {
  color: #cbd5e1;
  font-style: italic;
}
.blank input:focus {
  border-bottom-color: #3b82f6;
  background: #eff6ff;
}
.blank input:disabled {
  background: transparent;
  cursor: not-allowed;
}
.blank input.correct {
  background: #dcfce7;
  border-bottom-color: #16a34a;
  color: #166534;
  font-weight: 600;
}
.blank input.wrong {
  background: #fee2e2;
  border-bottom-color: #dc2626;
  color: #991b1b;
  text-decoration: line-through;
  text-decoration-thickness: 1.5px;
}
.blank-extra {
  position: absolute;
  right: -10px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 11px;
  font-weight: 600;
  padding: 1px 5px;
  border-radius: 4px;
  opacity: 0.9;
  pointer-events: none;
}
.blank-extra.correct { background: #16a34a; color: white; }
.blank-extra.wrong { background: #dc2626; color: white; }

/* ===== Choice options ===== */
.choices {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 14px;
}
.choice {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 14px;
  background: #f8fafc;
  border: 2px solid #e2e8f0;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 15px;
  user-select: none;
}
.choice:hover { border-color: #93c5fd; background: #f0f9ff; }
.choice.selected {
  border-color: #3b82f6;
  background: #eff6ff;
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
}
.choice input { margin-top: 4px; accent-color: #3b82f6; }
.choice .letter {
  font-weight: 700;
  color: #1e40af;
  min-width: 18px;
}
.choice.correct {
  background: #dcfce7;
  border-color: #16a34a;
}
.choice.wrong {
  background: #fee2e2;
  border-color: #dc2626;
}
.choice.disabled { cursor: not-allowed; }
.choice.disabled:hover { border-color: #e2e8f0; background: #f8fafc; }
.choice.correct-mark::after {
  content: '✓';
  margin-left: auto;
  color: #16a34a;
  font-weight: 700;
  font-size: 18px;
}

/* ===== Navigation bar ===== */
.nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid #e2e8f0;
  padding: 12px 16px max(12px, env(safe-area-inset-bottom));
  display: flex;
  gap: 10px;
  z-index: 50;
  box-shadow: 0 -4px 16px rgba(15, 23, 42, 0.05);
}
.btn {
  flex: 1;
  padding: 12px 18px;
  border-radius: 12px;
  border: none;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  outline: none;
}
.btn:active { transform: scale(0.97); }
.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.btn:disabled:active { transform: none; }
.btn-pri {
  background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
  color: white;
  box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
}
.btn-pri:hover:not(:disabled) {
  box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
  transform: translateY(-1px);
}
.btn-pri:active:not(:disabled) { transform: translateY(0); }
.btn-sec {
  background: #e2e8f0;
  color: #475569;
}
.btn-sec:hover:not(:disabled) {
  background: #cbd5e1;
}
.btn-success {
  background: linear-gradient(135deg, #10b981 0%, #059669 100%);
  color: white;
  box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
}
.btn-success:hover:not(:disabled) {
  box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
  transform: translateY(-1px);
}

/* ===== Result page ===== */
.result {
  display: none;
  padding: 6px 4px;
}
.result.active { display: block; }
.result-summary {
  background: white;
  border-radius: 18px;
  padding: 32px 20px;
  text-align: center;
  box-shadow: 0 6px 24px rgba(15, 23, 42, 0.07);
  margin-bottom: 18px;
}
.score-circle {
  --pct: 0;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: conic-gradient(
    #10b981 0deg calc(var(--pct) * 3.6deg),
    #e2e8f0 calc(var(--pct) * 3.6deg) 360deg
  );
  margin: 0 auto 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  animation: spinLoad 0.8s cubic-bezier(0.4, 0, 0.2, 1);
}
@keyframes spinLoad {
  from { transform: rotate(-90deg); opacity: 0; }
  to { transform: rotate(0); opacity: 1; }
}
.score-circle::before {
  content: '';
  position: absolute;
  inset: 10px;
  border-radius: 50%;
  background: white;
}
.score-value {
  position: relative;
  font-size: 42px;
  font-weight: 800;
  color: #0f172a;
  line-height: 1;
}
.score-value small {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: #64748b;
  margin-top: 4px;
}
.result-title {
  font-size: 22px;
  margin: 0 0 6px;
  font-weight: 700;
  color: #1e293b;
}
.result-subtitle {
  font-size: 14px;
  color: #64748b;
  margin: 0 0 16px;
}
.result-stats {
  display: flex;
  justify-content: center;
  gap: 28px;
  padding-top: 16px;
  border-top: 1px dashed #e2e8f0;
}
.stat {
  text-align: center;
}
.stat strong {
  display: block;
  font-size: 22px;
  font-weight: 700;
  color: #1e40af;
}
.stat span {
  font-size: 12px;
  color: #64748b;
}
.stat-good strong { color: #16a34a; }
.stat-bad strong { color: #dc2626; }

/* Result list */
.result-list {
  background: white;
  border-radius: 18px;
  box-shadow: 0 4px 18px rgba(15, 23, 42, 0.06);
  overflow: hidden;
  margin-bottom: 16px;
}
.result-list-title {
  padding: 16px 18px 4px;
  font-size: 14px;
  font-weight: 600;
  color: #64748b;
  letter-spacing: 0.5px;
}
.result-item {
  padding: 16px 18px;
  border-top: 1px solid #f1f5f9;
}
.result-item-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.result-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  font-size: 14px;
  font-weight: 700;
  color: white;
  flex-shrink: 0;
}
.result-badge.right { background: #16a34a; }
.result-badge.wrong { background: #dc2626; }
.result-qtitle { font-weight: 600; font-size: 15px; color: #1e293b; }
.result-qpoints {
  font-size: 12px;
  color: #64748b;
  background: #f1f5f9;
  padding: 2px 8px;
  border-radius: 6px;
  margin-left: auto;
}
.result-detail {
  padding-left: 36px;
  font-size: 13.5px;
  color: #475569;
}
.result-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin: 5px 0;
  line-height: 1.5;
}
.result-row .lbl {
  min-width: 60px;
  flex-shrink: 0;
  color: #64748b;
  font-size: 13px;
  padding-top: 1px;
}
.result-row .val {
  flex: 1;
  font-family: "SF Mono", Menlo, Consolas, monospace;
  font-size: 13.5px;
  word-break: break-word;
}
.result-row .val.empty { color: #94a3b8; font-style: italic; }
.result-row .val.right { color: #16a34a; }
.result-row .val.wrong { color: #dc2626; text-decoration: line-through; }
.result-row .val.show { color: #16a34a; font-weight: 600; }

.result-actions {
  display: flex;
  gap: 10px;
  margin-top: 8px;
}
.result-actions .btn { flex: 1; }

/* ===== 逐题解析卡片（原题 + 作答对照 + 关键步骤） ===== */
.result-q {
  background: white;
  border-radius: 16px;
  box-shadow: 0 4px 18px rgba(15, 23, 42, 0.06);
  border-top: 3px solid #e2e8f0;
  padding: 16px 18px 18px;
  margin-bottom: 14px;
}
.result-q.all-right { border-top-color: #10b981; }
.result-q.part-right { border-top-color: #f59e0b; }
.result-q.all-wrong { border-top-color: #ef4444; }
.result-q-head {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.result-badge.part { background: #f59e0b; }
.result-qsection {
  font-size: 12px;
  color: #94a3b8;
}
.qa-cap {
  font-size: 12.5px;
  font-weight: 700;
  color: #475569;
  letter-spacing: 0.4px;
  margin: 16px 0 8px;
}
.qa-cap-toggle {
  list-style: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  user-select: none;
}
.qa-cap-toggle::-webkit-details-marker { display: none; }
.qa-cap-toggle::after {
  content: '▾';
  font-size: 11px;
  color: #94a3b8;
  transition: transform 0.2s;
}
.qa-solution:not([open]) .qa-cap-toggle::after { transform: rotate(-90deg); }
.qa-solution:not([open]) .qa-cap-toggle { margin-bottom: 0; }

/* 原题 */
.qa-origin {
  background: #f8fafc;
  border: 1px solid #eef2f7;
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 14.5px;
  color: #334155;
  line-height: 1.75;
  overflow-x: auto;
}
.qa-origin p { margin: 8px 0; }
.inline-ans {
  display: inline-block;
  min-width: 60px;
  padding: 1px 9px;
  border-radius: 7px;
  font-family: "SF Mono", Menlo, Consolas, monospace;
  font-size: 13.5px;
  text-align: center;
  border-bottom: 2px solid #cbd5e1;
  background: #eef2f7;
  color: #334155;
}
.inline-ans.right { color: #15803d; background: #dcfce7; border-bottom-color: #16a34a; }
.inline-ans.wrong { color: #b91c1c; background: #fee2e2; border-bottom-color: #dc2626; }
.inline-ans.empty { color: #94a3b8; font-style: italic; background: #f1f5f9; }
.inline-ans.open { color: #4338ca; background: #eef2ff; border-bottom-color: #6366f1; font-style: normal; }
.ans-mark.open { color: #4338ca; }
.ans-block.open-ans { background: #f8fafc; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }

/* 原题中的选项 */
.origin-choices {
  list-style: none;
  padding: 0;
  margin: 12px 0 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.origin-choices li {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 8px;
  padding: 8px 12px;
  border-radius: 10px;
  background: white;
  border: 1px solid #e2e8f0;
  font-size: 14px;
  color: #334155;
}
.origin-choices li.correct-opt {
  border-color: #16a34a;
  background: #f0fdf4;
}
.origin-choices li.picked-wrong {
  border-color: #dc2626;
  background: #fef2f2;
}
.opt-tag {
  margin-left: auto;
  font-size: 11.5px;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: 5px;
  white-space: nowrap;
}
.opt-tag.t-right { background: #16a34a; color: white; }
.opt-tag.t-wrong { background: #dc2626; color: white; }
.opt-tag.t-std { background: #e2e8f0; color: #475569; }

/* 作答对照 */
.qa-answers { display: flex; flex-direction: column; gap: 8px; }
.ans-block {
  background: #f8fafc;
  border-radius: 11px;
  padding: 10px 12px;
}
.ans-block-title {
  font-size: 13px;
  font-weight: 600;
  color: #475569;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.ans-mark { font-weight: 700; }
.ans-mark.right { color: #16a34a; }
.ans-mark.wrong { color: #dc2626; }
.ans-block .result-row { padding-left: 0; }

/* 正确答案：KaTeX 渲染后的数学式 */
.ans-block .std-tex { display: inline-block; vertical-align: middle; }
/* 输入写法：等宽代码 + 复制 */
.ans-block .fmt-code {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.ans-block .fmt-code code {
  font-family: 'Cascadia Code', 'Consolas', 'SFMono-Regular', Menlo, monospace;
  font-size: 13px;
  background: #eef2ff;
  color: #3730a3;
  border: 1px solid #c7d2fe;
  border-radius: 6px;
  padding: 2px 7px;
  word-break: break-all;
}
.copy-btn {
  font-size: 12px;
  line-height: 1;
  padding: 3px 8px;
  border: 1px solid #c7d2fe;
  border-radius: 6px;
  background: #fff;
  color: #4338ca;
  cursor: pointer;
}
.copy-btn:active { background: #e0e7ff; }


/* 解析 */
.qa-solution .sol-body {
  background: linear-gradient(135deg, #f0f9ff 0%, #f5f3ff 100%);
  border: 1px solid #e0e7ff;
  border-radius: 12px;
  padding: 12px 14px;
}
.sol-item + .sol-item { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #dbeafe; }
.sol-lbl {
  font-size: 12.5px;
  font-weight: 700;
  color: #4338ca;
  margin-bottom: 4px;
}
.sol-txt {
  font-size: 14px;
  color: #334155;
  line-height: 1.8;
  overflow-x: auto;
}

/* KaTeX overflow */
.katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
.katex-display > .katex { display: inline-block; }

/* ===== Context (题目背景) ===== */
.context {
  background: linear-gradient(135deg, #fefce8 0%, #fef9c3 100%);
  border: 1px solid #fde68a;
  border-radius: 14px;
  margin-bottom: 16px;
  overflow: hidden;
}
.context summary {
  padding: 12px 16px;
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  color: #92400e;
  list-style: none;
  user-select: none;
  display: flex;
  align-items: center;
  gap: 6px;
}
.context summary::-webkit-details-marker { display: none; }
.context summary::before {
  content: '▸';
  display: inline-block;
  transition: transform 0.2s;
  font-size: 12px;
}
.context[open] summary::before { transform: rotate(90deg); }
.context-body {
  padding: 4px 18px 16px;
  font-size: 14px;
  color: #422006;
  line-height: 1.75;
}
.context-body p { margin: 10px 0; }

/* 题内提示行 */
.q-tip {
  font-size: 13.5px;
  color: #64748b;
  background: #f8fafc;
  border-left: 3px solid #cbd5e1;
  padding: 7px 12px;
  border-radius: 0 8px 8px 0;
  margin: 10px 0 0;
  line-height: 1.6;
}

/* 空位旁的标注徽章（开放作答提示） */
.fmt-tag {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 8px;
  border-radius: 999px;
  font-size: 11.5px;
  line-height: 1.7;
  vertical-align: middle;
  white-space: nowrap;
  border: 1px solid transparent;
}
/* 空位旁的格式提示（显示在填空框外） */
.blank-hint {
  font-size: 11.5px;
  color: #94a3b8;
  margin-left: 4px;
  vertical-align: middle;
  white-space: normal;
}
.fmt-tag.open { background: #eef2ff; color: #4338ca; border-color: #c7d2fe; }
.blank input.blank-open { width: 190px; max-width: 62vw; }

/* Responsive */
@media (max-width: 480px) {
  .q-card { padding: 20px 16px; border-radius: 14px; }

// 计分空位（noScore 的"开放作答题"不计分，但仍显示参考答案）
const SCORED_BLANKS = [];
QUESTIONS.forEach(q => q.blanks.forEach(b => { if (!b.noScore) SCORED_BLANKS.push(b); }));
const TOTAL_BLANKS = SCORED_BLANKS.length;
// 加权计分：每个空位自带 score，合计 100
const TOTAL_SCORE = SCORED_BLANKS.reduce((s, b) => s + (b.score || 0), 0);

/* ===================== 评分相关 ===================== */

// 归一化：去首尾空格、内部空白折叠
function normalize(s) {
  if (s == null) return '';
  return String(s).trim().replace(/\s+/g, '');
}

// 解析纯数字（或纯数字表达式，如 1/5、0.2、3.14、-2）
function tryParseNumber(s) {
  if (!s) return null;
  if (/[,，、;；]/.test(s)) return null;             // 数字列表交给 tryParseNumberList
  if (/[a-zA-Z\u0370-\u03ff]/.test(s)) return null; // 跳过含字母/希腊字母
  // 替换 \pi \e 等
  const cleaned = s
    .replace(/\\pi/g, 'Math.PI')
    .replace(/\\mathrm\{e\}/g, 'Math.E')
    .replace(/\\e(?![a-zA-Z])/g, 'Math.E');
  try {
    const v = Function('"use strict"; return (' + cleaned + ')')();
    if (typeof v === 'number' && !isNaN(v) && isFinite(v)) return v;
  } catch (e) {}
  return null;
}

// 希腊字母命令 → 单字符（便于把 \lambda 等当成变量识别）
const GREEK_MAP = {
  lambda: 'λ', alpha: 'α', beta: 'β', gamma: 'γ', delta: 'δ', epsilon: 'ε',
  varepsilon: 'ε', zeta: 'ζ', eta: 'η', theta: 'θ', iota: 'ι', kappa: 'κ',
  mu: 'μ', nu: 'ν', xi: 'ξ', pi: 'π', rho: 'ρ', sigma: 'σ', tau: 'τ',
  upsilon: 'υ', phi: 'φ', varphi: 'φ', chi: 'χ', psi: 'ψ', omega: 'ω',
  Gamma: 'Γ', Delta: 'Δ', Theta: 'Θ', Lambda: 'Λ', Xi: 'Ξ', Pi: 'Π',
  Sigma: 'Σ', Phi: 'Φ', Psi: 'Ψ', Omega: 'Ω'
};

// LaTeX → 可求值的纯文本：分式、根式、希腊字母命令展开，其余命令剥离
function texToPlain(s) {
  return String(s)
    .replace(/\\d?frac\s*\{([^{}]+)\}\s*\{([^{}]+)\}/g, '(($1)/($2))')
    .replace(/\\sqrt\s*\{([^{}]+)\}/g, '(($1)**(1/2))')
    .replace(/\\sqrt\s*(\d)/g, '(($1)**(1/2))')
    .replace(/\\(?:left|right|big|Big|displaystyle|text|operatorname)\s*\{?([^{}]*)\}?/g, '$1')
    .replace(/\\(?:,|!|;|:|quad|qquad)/g, '')
    .replace(/\\mathrm\s*\{([^{}]*)\}/g, '$1')
    .replace(/\\([a-zA-Z]+)/g, (m, name) => (GREEK_MAP[name] !== undefined ? GREEK_MAP[name] : ''))
    .replace(/\s+/g, '')
    .replace(/\^/g, '**');
}

// 解析含【任意单个变量】的表达式（多点取值判断等价；变量名不同也互认，如 λ 与 x）
function tryParseExpression(s) {
  if (!s) return null;
  let cleaned;
  try {
    cleaned = texToPlain(s);
  } catch (e) { return null; }

  // 找出表达式里出现的全部变量字符（拉丁字母 / 希腊字母）
  const vars = new Set();
  for (const ch of cleaned) {
    if (/[a-zA-Z\u0370-\u03ff]/.test(ch)) vars.add(ch.toLowerCase());
  }
  if (vars.size !== 1) return null;   // 0 个（纯数字）或 ≥2 个（多元）都不做等价判定
  const v = Array.from(vars)[0];

  try {
    const testValues = [0, 1, 2, -1, 0.5, 1.5, 3];
    const results = testValues.map(xv => {
      let expr = cleaned
        .split(v).join('(' + xv + ')')
        .replace(/(\d)\(/g, '$1*(')   // 隐式乘法: 3( → 3*(
        .replace(/\)(\d)/g, ')*$1')   // 隐式乘法: )3 → )*3
        .replace(/\)\(/g, ')*(');     // 隐式乘法: )( → )*(
      return Function('"use strict"; return (' + expr + ')')();
    });
    if (results.every(r => typeof r === 'number' && !isNaN(r) && isFinite(r))) {
      return results;
    }
  } catch (e) {}
  return null;
}

// 解析逗号/顿号分隔的数字集合（如特征值 "-2,-1,1"），忽略顺序
function tryParseNumberList(s) {
  if (!s) return null;
  const parts = s.split(/[,，、;；]+/).filter(x => x !== '');
  if (parts.length < 2) return null;
  const nums = [];
  for (const p of parts) {
    const cleaned = p.replace(/^[a-zA-Z\u0370-\u03ff]+\d*\s*[:=＝]?/, ''); // 去掉 λ1= 之类前缀
    const n = tryParseNumber(cleaned);
    if (n === null) return null;
    nums.push(n);
  }
  return nums.sort((a, b) => a - b);
}

// LaTeX 归一化：统一 \dfrac→\frac、√与\sqrt2 的写法、展开短上标 ^{T}→^T
function stripLatex(x) {
  return String(x)
    .replace(/\\dfrac/g, '\\frac')
    .replace(/\\!/g, '')
    .replace(/\\,/g, '')
    .replace(/\\;/g, '')
    .replace(/\\left/g, '')
    .replace(/\\right/g, '')
    .replace(/\\mathrm\{([^}]+)\}/g, '$1')
    .replace(/\\,|\!|\;/g, '')
    .replace(/√/g, '\\sqrt')
    .replace(/sqrt\s*\(([^()]+)\)/g, '\\sqrt{$1}')   // sqrt(2) ≡ \sqrt{2}（学生键盘写法）
    .replace(/\\sqrt\s*(\d)/g, '\\sqrt{$1}')
    .replace(/\\sqrt\s*\{(\d+)\}/g, '\\sqrt{$1}')
    .replace(/\^\{([^{}]{1,3})\}/g, '^$1')
    .replace(/\s+/g, '')
    .toLowerCase();
}

// 单个标准答案与作答的比较（归一化后的字符串 → 数字 → 数字集合 → 单变量表达式）
function matchOnce(s, c) {
  if (!s || !c) return false;
  if (s === c) return true;
  if (stripLatex(s) === stripLatex(c)) return true;

  // 数字等价（含分数/小数互换）
  const sNum = tryParseNumber(s);
  const cNum = tryParseNumber(c);
  if (sNum !== null && cNum !== null && Math.abs(sNum - cNum) < 1e-6) return true;

  // 数字集合等价（顺序无关，如特征值 "-2,-1,1" 与 "1,-1,-2"）
  const sList = tryParseNumberList(s);
  const cList = tryParseNumberList(c);
  if (sList && cList && sList.length === cList.length) {
    if (sList.every((v, i) => Math.abs(v - cList[i]) < 1e-6)) return true;
  }

  // 单变量表达式等价（变量名可不同：λ 与 x 互认；多点取值比较）
  const sExpr = tryParseExpression(s);
  const cExpr = tryParseExpression(c);
  if (sExpr && cExpr && sExpr.length === cExpr.length) {
    let match = true;
    for (let i = 0; i < sExpr.length; i++) {
      if (typeof sExpr[i] !== 'number' || Math.abs(sExpr[i] - cExpr[i]) > 1e-5) {
        match = false;
        break;
      }
    }
    if (match) return true;
  }

  return false;
}

// 字面量匹配：用于含 ^ 幂次的系数答案（避免把 ^ 当成按位异或求值，如 2^100-101）
function matchLiteral(s, c, accept) {
  const norm = x => String(x == null ? '' : x)
    .replace(/\\left|\\right|\\!/g, '')
    .replace(/\*\*/g, '^')
    .replace(/\^\s*\{\s*([^{}]+?)\s*\}/g, '^($1)')
    .replace(/\^\s*\(\s*([^()]+?)\s*\)/g, '^$1')
    .replace(/\s+/g, '')
    .toLowerCase();
  const sn = norm(s);
  if (!sn) return false;
  if (sn === norm(c)) return true;
  if (Array.isArray(accept)) {
    for (let i = 0; i < accept.length; i++) {
      if (sn === norm(accept[i])) return true;
    }
  }
  return false;
}

// 比较两个答案；accept 为该空位额外可接受的等价写法数组
function answersMatch(student, correct, accept) {
  const s = normalize(student);
  const c = normalize(correct);
  if (!s) return false;
  if (c && matchOnce(s, c)) return true;
  if (Array.isArray(accept)) {
    for (let i = 0; i < accept.length; i++) {
      if (matchOnce(s, normalize(accept[i]))) return true;
    }
  }
  return false;
}

/* ===================== KaTeX 渲染 ===================== */

function renderMathInElement(root) {
  if (typeof katex === 'undefined') return; // 兜底

  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      // 跳过 KaTeX 已渲染的内容
      let p = node.parentNode;
      while (p && p !== root) {
        if (p.classList && (p.classList.contains('katex') || p.classList.contains('katex-display'))) {
          return NodeFilter.FILTER_REJECT;
        }
        p = p.parentNode;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const textNodes = [];
  let n;
  while ((n = walker.nextNode())) textNodes.push(n);

  textNodes.forEach(node => {
    const text = node.nodeValue;
    if (text.indexOf('$') < 0) return;

    // 解析为 segments
    const segs = [];
    let i = 0;
    while (i < text.length) {
      if (text[i] === '$') {
        if (text[i + 1] === '$') {
          const end = text.indexOf('$$', i + 2);
          if (end > i + 2) {
            segs.push({ type: 'display', tex: text.substring(i + 2, end) });
            i = end + 2;
            continue;
          }
        }
        const end = text.indexOf('$', i + 1);
        if (end > i + 1) {
          segs.push({ type: 'inline', tex: text.substring(i + 1, end) });
          i = end + 1;
          continue;
        }
        // 孤立的 $（无配对）：作为普通文本处理，避免死循环
        segs.push({ type: 'text', content: '$' });
        i++;
        continue;
      }
      let j = i;
      while (j < text.length && text[j] !== '$') j++;
      segs.push({ type: 'text', content: text.substring(i, j) });
      i = j;
    }

    const temp = document.createElement('span');
    segs.forEach(seg => {
      if (seg.type === 'text') {
        temp.appendChild(document.createTextNode(seg.content));
      } else {
        try {
          const html = katex.renderToString(seg.tex, {
            throwOnError: false,
            displayMode: seg.type === 'display',
            output: 'html' // 不输出 MathML，避免部分浏览器显示多余的纯文本公式行
          });
          const wrap = document.createElement('span');
          wrap.innerHTML = html;
          while (wrap.firstChild) temp.appendChild(wrap.firstChild);
        } catch (e) {
          temp.appendChild(document.createTextNode(
            (seg.type === 'display' ? '$$' : '$') + seg.tex +
            (seg.type === 'display' ? '$$' : '$')
          ));
        }
      }
    });
    if (node.parentNode) {
      node.parentNode.replaceChild(temp, node);
    }
  });
}

const state = {

  submitted: false
};

/* ===================== 数据采集（上报后端） ===================== */

const PAPER_ID = 'linalg-cayley-hamilton-1-4';
const PAPER_TITLE = '线性代数课堂测试 · 1.4 Cayley–Hamilton 定理';
/* 是否启用答题数据上报：本次不需要采集，关闭（学生本机作答，不联网上传） */
const ENABLE_COLLECT = false;
/* 后端地址：与页面同源时留空即可。
   若答题页由静态空间打开（如已发布的公网链接），请把后端地址填到这里，
   例如 'http://192.168.1.20:8080'（校园网/局域网可达），也可在页面里设置 window.QUIZ_API_BASE。 */
const API_BASE = window.QUIZ_API_BASE || (location.protocol === 'file:' ? 'http://localhost:8080' : '');

/* 身份标识：游客用浏览器长期匿名 token + 会话 ID；登录后可由 window.CURRENT_USER 或 ?uid= 关联真实用户 */
const collect = {
  visitorToken: (function () {
    try {
      let v = localStorage.getItem('quiz_visitor_token');
      if (!v) {
        v = 'v_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
        localStorage.setItem('quiz_visitor_token', v);
      }
      return v;
    } catch (e) { return 'v_' + Math.random().toString(36).slice(2, 12); }
  })(),
  sessionId: (function () {
    try {
      let s = sessionStorage.getItem('quiz_session_id');
      if (!s) {
        s = 's_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
        sessionStorage.setItem('quiz_session_id', s);
      }
      return s;
    } catch (e) { return 's_' + Math.random().toString(36).slice(2, 12); }
  })(),
  startedAt: (function () {
    try {
      let t = sessionStorage.getItem('quiz_started_at');
      if (!t) { t = new Date().toISOString(); sessionStorage.setItem('quiz_started_at', t); }
      return t;
    } catch (e) { return new Date().toISOString(); }
  })(),
  qTime: {},        // { 题目ID: 累计停留毫秒 }
  enterAt: Date.now(),
  reported: false   // 本次提交是否已成功上报
};

/** 预留：登录系统可注入 window.CURRENT_USER = { id:'20231201', name:'张三' } */
function resolveIdentity() {
  let externalId = '';
  const g = window.CURRENT_USER;
  if (g && g.id) externalId = String(g.id);
  if (!externalId) {
    const m = /[?&]uid=([^&]+)/.exec(location.search);
    if (m) externalId = decodeURIComponent(m[1]);
  }
  if (!externalId) {
    try { externalId = localStorage.getItem('quiz_user_id') || ''; } catch (e) { }
  }
  const displayName = (g && g.name) || '';
  return { externalId: externalId || '', displayName: displayName || '' };
}

/** 切换/提交时结算当前题目的停留时间 */
function flushQuestionTime() {
  if (!collect.enterAt) return;
  const q = QUESTIONS[state.current];
  if (q) {
    const id = String(q.id);
    collect.qTime[id] = (collect.qTime[id] || 0) + (Date.now() - collect.enterAt);
  }
  collect.enterAt = Date.now();
}

function stripTags(s) {
  return String(s || '').replace(/<[^>]*>/g, '').replace(/\$/g, '').replace(/\s+/g, ' ').trim();
}

function buildPayload(results, correctCount) {
  const perItem = 100 / results.length;
  const identity = resolveIdentity();
  const items = results.map((r, i) => {
    const isChoice = (r.qType === 'choice' || r.qType === 'judge');
    return {
      orderIndex: i,
      questionId: String(r.qId),
      questionTitle: stripTags(r.qTitle),
      blankKey: String(r.key),
      label: stripTags(r.label),
      section: r.qSection || '',
      qType: r.qType || '',
      userAnswer: r.student || '',
      correctAnswer: isChoice ? (r.correctChoice || '') : (r.correct || ''),
      isCorrect: !!r.isCorrect,
      earnedScore: r.isCorrect ? perItem : 0,
      fullScore: perItem,
      points: r.qPoints === undefined ? null : r.qPoints,
      timeSpentMs: collect.qTime[String(r.qId)] === undefined
        ? null : Math.round(collect.qTime[String(r.qId)])
    };
  });
  const submittedAt = new Date().toISOString();
  const durationMs = Math.max(0, new Date(submittedAt).getTime() - new Date(collect.startedAt).getTime());
  return {
    submitId: collect.submitId,
    sessionId: collect.sessionId,
    visitorToken: collect.visitorToken,
    externalUserId: identity.externalId || null,
    displayName: identity.displayName || null,
    userType: identity.externalId ? 'user' : 'guest',
    paperId: PAPER_ID,
    paperTitle: PAPER_TITLE,
    totalItems: items.length,
    correctCount: correctCount,
    totalScore: Math.round(correctCount / results.length * 10000) / 100,
    startedAt: collect.startedAt,
    submittedAt: submittedAt,
    durationMs: durationMs,
    sourceUrl: location.href,
    sourceReferrer: document.referrer || '',
    items: items
  };
}

function showUploadTip(msg, kind) {
  let el = document.getElementById('uploadTip');
  if (!el) {
    el = document.createElement('div');
    el.id = 'uploadTip';
    el.style.cssText = 'position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:200;' +
      'padding:9px 16px;border-radius:10px;color:#fff;font-size:13px;opacity:0;transition:opacity .25s;' +
      'pointer-events:none;max-width:88vw;text-align:center;box-shadow:0 6px 18px rgba(15,23,42,.2)';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.background = kind === 'ok' ? '#15803d' : (kind === 'err' ? '#b45309' : '#0f172a');
  el.style.opacity = '1';
  clearTimeout(el._h);
  el._h = setTimeout(() => { el.style.opacity = '0'; }, kind === 'ok' ? 2800 : 5200);
}

/* 上报失败时暂存在本地，稍后自动重传 */
function queuePayload(payload) {
  try {
    const arr = JSON.parse(localStorage.getItem('quiz_pending') || '[]');
    arr.push(payload);
    localStorage.setItem('quiz_pending', JSON.stringify(arr.slice(-20)));
  } catch (e) { /* 忽略 */ }
}
function flushQueue() {
  let arr = [];
  try { arr = JSON.parse(localStorage.getItem('quiz_pending') || '[]'); } catch (e) { return; }
  if (!arr.length) return;
  const rest = arr.slice();
  rest.forEach(p => sendSubmission(p, true));
  try { localStorage.removeItem('quiz_pending'); } catch (e) { }
}

function sendSubmission(payload, isRetry) {
  const url = (API_BASE || '') + '/api/submit';
  fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(r => r.json().then(j => ({ status: r.status, body: j })))
    .then(({ status, body }) => {
      if (body && body.ok) {
        collect.reported = true;
        showUploadTip(body.duplicated ? '已记录（重复提交已忽略）' : '作答已记录（编号 #' + body.attemptId + '）', 'ok');
        try { localStorage.removeItem('quiz_pending'); } catch (e) { }
        return;
      }
      if (status === 409) { showUploadTip('已记录，请勿重复提交', 'ok'); return; }
      throw new Error((body && body.message) || ('HTTP ' + status));
    })
    .catch(err => {
      if (!isRetry) { queuePayload(payload); }
      else { queuePayload(payload); }
      showUploadTip('成绩上报失败：' + (err.message || '网络异常') + '（已暂存，稍后自动重传）', 'err');
    });
}

/* ===================== 题目渲染 ===================== */

function buildQuestionCard(q, idx) {
  const card = document.createElement('article');
  card.className = 'q-card';
  card.dataset.qid = q.id;

  const head = document.createElement('div');
  head.className = 'q-head';
  head.innerHTML = `
    <h2 class="q-title">${q.title}</h2>
    <span class="q-points">${q.points} 分</span>
  `;

  const section = document.createElement('div');
  section.className = 'q-section';
  // 渲染 section 中的 LaTeX
  section.innerHTML = q.section;
  renderMathInElement(section);

  const content = document.createElement('div');
  content.className = 'q-content';
  content.innerHTML = q.content;
  renderMathInElement(content);

  card.appendChild(section);
  card.appendChild(head);
  card.appendChild(content);

  // 选择题 / 判断题
  if (q.type === 'choice' || q.type === 'judge') {
    const wrap = document.createElement('div');
    wrap.className = 'choices';
    q.choices.forEach(c => {
      const id = 'q' + q.id + '-' + c.letter;
      const item = document.createElement('label');
      item.className = 'choice';
      item.dataset.letter = c.letter;
      item.innerHTML = `
        <input type="radio" name="q${q.id}" id="${id}" value="${c.letter}">
        <span class="letter">${c.letter}.</span>
        <span class="choice-text"></span>
      `;
      item.querySelector('.choice-text').innerHTML = c.label;
      renderMathInElement(item.querySelector('.choice-text'));

      const radio = item.querySelector('input');
      radio.addEventListener('change', () => {
        if (state.submitted) return;
        state.answers[q.blanks[0].key] = c.letter;
        wrap.querySelectorAll('.choice').forEach(el => el.classList.remove('selected'));
        item.classList.add('selected');
        updateProgress();
      });

      // restore
      if (state.answers[q.blanks[0].key] === c.letter) {
        radio.checked = true;
        item.classList.add('selected');
      }

      // 提交后样式
      if (state.submitted) {
        radio.disabled = true;
        item.classList.add('disabled');
        if (c.letter === q.correctChoice) item.classList.add('correct', 'correct-mark');
        if (state.answers[q.blanks[0].key] === c.letter && c.letter !== q.correctChoice) {
          item.classList.add('wrong');
        }
      }

      wrap.appendChild(item);
    });
    card.appendChild(wrap);
  }

  // 填空题：把 <span class="blank-slot"> 替换为 input
  const slots = card.querySelectorAll('.blank-slot');
  slots.forEach(span => {
    const bid = span.getAttribute('data-bid');
    const blank = q.blanks.find(b => b.key === bid);
    const value = state.answers[bid] || '';

    const wrap = document.createElement('span');
    wrap.className = 'blank';

    const input = document.createElement('input');
    input.type = 'text';
    input.value = value;
    input.placeholder = '?';
    if (blank && blank.noScore) input.classList.add('blank-open');
    input.dataset.bid = bid;
    input.autocomplete = 'off';
    input.spellcheck = false;

    input.addEventListener('input', e => {
      if (state.submitted) return;
      state.answers[bid] = e.target.value;
      updateProgress();
    });

    wrap.appendChild(input);

    // 格式提示：显示在填空框外（输入框内不再显示；交卷后由正确答案替代）
    if (blank && blank.hint && !state.submitted) {
      const tip = document.createElement('span');
      tip.className = 'blank-hint';
      tip.textContent = blank.hint;
      wrap.appendChild(tip);
    }

    // 开放作答题（不计分）：只标注"提交后看要点"
    if (blank && blank.noScore) {
      const tag = document.createElement('span');
      tag.className = 'fmt-tag open';
      tag.textContent = '开放作答 · 不计分';
      tag.title = '提交后可与参考要点对照';
      wrap.appendChild(tag);
    }

    if (state.submitted && !(blank && blank.noScore)) {
      input.disabled = true;
      const correct = answersMatch(value, blank.correct, blank.accept);
      if (correct) {
        input.classList.add('correct');
      } else {
        input.classList.add('wrong');
        const tag = document.createElement('span');
        tag.className = 'blank-extra correct';
        tag.textContent = '✓ ' + blank.correct;
        wrap.appendChild(tag);
      }
    }

    span.replaceWith(wrap);
  });

  return card;
}

function renderAllQuestions() {
  const container = document.getElementById('cards');
  container.innerHTML = '';
  QUESTIONS.forEach((q, idx) => {
    const card = buildQuestionCard(q, idx);
    if (idx === state.current) card.classList.add('active');
    container.appendChild(card);
  });
}

function showQuestion(idx) {
  flushQuestionTime(); // 结算上一题停留时间
  state.current = Math.max(0, Math.min(QUESTIONS.length - 1, idx));
  const cards = document.querySelectorAll('.q-card');
  cards.forEach((c, i) => {
    if (i === state.current) c.classList.add('active');
    else c.classList.remove('active');
  });
  document.getElementById('main').scrollTo({ top: 0, behavior: 'smooth' });
  window.scrollTo({ top: 0, behavior: 'smooth' });
  updateProgress();
  updateNavButtons();
}

function updateProgress() {
  const cur = state.current + 1;
  const total = QUESTIONS.length;
  document.getElementById('progress').textContent = `第 ${cur} / ${total} 题`;
  document.getElementById('barFill').style.width = (cur / total * 100) + '%';

  const filled = QUESTIONS.reduce((sum, q) => {
    return sum + q.blanks.filter(b => !b.noScore && (state.answers[b.key] || '').trim()).length;
  }, 0);
  const filledEl = document.getElementById('filled');
  filledEl.textContent = `已作答 ${filled} / ${TOTAL_BLANKS}`;
  if (filled === TOTAL_BLANKS) {
    filledEl.classList.add('filled-good');
  } else {
    filledEl.classList.remove('filled-good');
  }
}

function updateNavButtons() {
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  prevBtn.disabled = state.current === 0;
  if (state.current === QUESTIONS.length - 1) {
    nextBtn.textContent = '✓ 提交查看结果';
    nextBtn.classList.remove('btn-pri');
    nextBtn.classList.add('btn-success');
  } else {
    nextBtn.textContent = '下一题 →';
    nextBtn.classList.add('btn-pri');
    nextBtn.classList.remove('btn-success');
  }
}

/* ===================== 提交与判分 ===================== */

function makeSubmitId() {
  const rnd = (typeof crypto !== 'undefined' && crypto.randomUUID)
    ? crypto.randomUUID().replace(/-/g, '')
    : (Math.random().toString(36).slice(2, 14) + Date.now().toString(36));
  return 'sub_' + rnd.slice(0, 32);
}

function submitAll() {
  if (!confirm('确定要提交吗？提交后无法修改。')) return;
  state.submitted = true;
  document.getElementById('prevBtn').disabled = true;
  document.getElementById('nextBtn').disabled = true;
  // 顶部进度改为完成状态
  document.getElementById('progress').textContent = '测试已完成';
  document.getElementById('barFill').style.width = '100%';
  const { results, correctCount, earnedScore } = gradeAnswers();
  const filledEl = document.getElementById('filled');
  filledEl.textContent = `得分 ${Math.round(earnedScore / TOTAL_SCORE * 100)} 分（答对 ${correctCount} / ${TOTAL_BLANKS} 空）`;
  filledEl.classList.add('filled-good');
  renderResult();

  // ---- 采集并上报本次作答（本次未启用，ENABLE_COLLECT=false 时直接跳过）----
  if (ENABLE_COLLECT) {
    try {
      flushQuestionTime();                 // 结算最后一题停留时间
      collect.submitId = makeSubmitId();   // 幂等键：网络失败重试不会产生重复记录
      const payload = buildPayload(results, correctCount);
      sendSubmission(payload, false);
    } catch (e) {
      console.error('上报失败', e);
      showUploadTip('成绩上报异常：' + (e && e.message), 'err');
    }
  }
}

function gradeAnswers() {
  const results = [];
  let correctCount = 0;   // 答对的作答点个数
  let earnedScore = 0;    // 答对作答点的分值合计（加权）
  QUESTIONS.forEach(q => {
    q.blanks.forEach(b => {
      const studentAns = state.answers[b.key] || '';
      const isCorrect = b.noScore ? null
        : (b.literal ? matchLiteral(studentAns, b.correct, b.accept) : answersMatch(studentAns, b.correct, b.accept));
      if (isCorrect) {
        correctCount++;
        earnedScore += (b.score || 0);
      }
      results.push({
        qId: q.id,
        key: b.key,
        qTitle: q.title,
        qPoints: q.points,
        qSection: q.section,
        qType: q.type,
        correctChoice: q.correctChoice,
        label: b.label,
        correct: b.correct,
        fmt: b.fmt || '',
        solution: b.solution || '',
        hint: b.hint || '',
        noScore: !!b.noScore,
        blankScore: b.score || 0,
        student: studentAns,
        isCorrect
      });
    });
  });
  return { results, correctCount, earnedScore };
}

function renderResult() {
  const { results, correctCount, earnedScore } = gradeAnswers();
  const total = TOTAL_BLANKS;
  const score = Math.round(earnedScore / TOTAL_SCORE * 100);
  const wrongCount = total - correctCount;

  // 隐藏题目卡片、显示结果页
  document.querySelectorAll('.q-card').forEach(c => c.classList.add('hidden'));
  document.getElementById('result').classList.add('active');
  document.getElementById('navBar').style.display = 'none';
  const ctxEl = document.querySelector('.context');
  if (ctxEl) ctxEl.style.display = 'none';

  // 分数
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('scoreCircle').style.setProperty('--pct', score);
  document.getElementById('statRight').textContent = correctCount;
  document.getElementById('statWrong').textContent = wrongCount;
  document.getElementById('statTotal').textContent = total;

  // 评语
  const title = document.getElementById('resultTitle');
  const subtitle = document.getElementById('resultSubtitle');
  if (score >= 90) {
    title.textContent = '🏆 优秀！';
    subtitle.textContent = '掌握得非常扎实，可向更高难度挑战。';
  } else if (score >= 75) {
    title.textContent = '👍 良好';
    subtitle.textContent = '整体不错，部分细节仍可进一步完善。';
  } else if (score >= 60) {
    title.textContent = '🌱 及格';
    subtitle.textContent = '基础已有，建议回顾题目背景与关键计算步骤。';
  } else {
    title.textContent = '📚 加油';
    subtitle.textContent = '别灰心，先把题目背景与公式再读一遍，再做一遍。';
  }

  // 渲染逐题结果：原题 + 作答对照 + 解析（关键步骤）
  const items = document.getElementById('resultItems');
  items.innerHTML = '';

  QUESTIONS.forEach(q => {
    const qResults = results.filter(r => r.qId === q.id);
    if (!qResults.length) return;

    // noScore 的开放作答不计入对错统计
    const graded = qResults.filter(r => !r.noScore);
    const rightCount = graded.filter(r => r.isCorrect).length;
    const allRight = graded.length > 0 && rightCount === graded.length;
    const allWrong = graded.length > 0 && rightCount === 0;
    const isChoice = (q.type === 'choice' || q.type === 'judge');

    const box = document.createElement('div');
    box.className = 'result-q ' + (allRight ? 'all-right' : (allWrong ? 'all-wrong' : 'part-right'));

    // ---------- ① 头部 ----------
    let html = `
      <div class="result-q-head">
        <span class="result-badge ${allRight ? 'right' : (allWrong ? 'wrong' : 'part')}">${allRight ? '✓' : (allWrong ? '✗' : '±')}</span>
        <span class="result-qtitle">${escapeHtml(q.title)}</span>
        <span class="result-qsection">${q.section}</span>
        <span class="result-qpoints">${q.points} 分 · 答对 ${rightCount}/${graded.length} 空</span>
      </div>
    `;

    // ---------- ② 原题（把空位替换为学生作答） ----------
    let originContent = q.content;
    qResults.forEach(r => {
      const escKey = r.key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp('<span class="blank-slot" data-bid="' + escKey + '"></span>', 'g');
      const ansTxt = r.student ? escapeHtml(r.student) : '未作答';
      const cls = r.noScore ? 'open' : (r.student ? (r.isCorrect ? 'right' : 'wrong') : 'empty');
      originContent = originContent.replace(
        re,
        `<span class="inline-ans ${cls}">${ansTxt}</span>`
      );
    });

    let choicesHtml = '';
    if (isChoice && q.choices) {
      const picked = (qResults[0].student || '').toUpperCase();
      choicesHtml = '<ul class="origin-choices">' + q.choices.map(c => {
        const isPicked = picked === c.letter;
        const isStd = q.correctChoice === c.letter;
        const cls = isStd ? 'correct-opt' : (isPicked ? 'picked-wrong' : '');
        let tag = '';
        if (isStd && isPicked) tag = '<span class="opt-tag t-right">你选对了</span>';
        else if (isStd) tag = '<span class="opt-tag t-std">正确答案</span>';
        else if (isPicked) tag = '<span class="opt-tag t-wrong">你选择</span>';
        return `<li class="${cls}"><b>${c.letter}.</b><span class="opt-body">${c.label}</span>${tag}</li>`;
      }).join('') + '</ul>';
    }

    html += `
      <div class="qa-cap">📄 原题</div>
      <div class="qa-origin">${originContent}${choicesHtml}</div>
    `;

    // ---------- ③ 作答对照 ----------
    html += '<div class="qa-cap">✍️ 作答对照</div><div class="qa-answers">';
    qResults.forEach((r, i) => {
      const idx = qResults.length > 1 ? (['①', '②', '③', '④'][i] || (i + 1)) + ' ' : '';
      let youHtml, stdHtml;
      if (r.noScore) {
        // 开放作答题：不计分，给出参考要点
        html += `
          <div class="ans-block open-ans">
            <div class="ans-block-title"><span class="ans-mark open">✎</span>${r.label}<span class="fmt-tag open">不计分</span></div>
            <div class="result-row"><span class="lbl">你的作答：</span>${r.student ? `<span class="val">${escapeHtml(r.student)}</span>` : '<span class="val empty">(未作答)</span>'}</div>
            <div class="result-row"><span class="lbl">参考要点：</span><span class="val show">${r.solution}</span></div>
          </div>
        `;
        return;
      }
      // 选择题里若还带有填空空位（如第6题的三个系数），只有首个空位按“选项”展示
      const isChoiceBlank = isChoice && r.key === q.blanks[0].key;
      if (isChoiceBlank) {
        const youLetter = (r.student || '').toUpperCase();
        const youObj = q.choices && q.choices.find(c => c.letter === youLetter);
        const stdObj = q.choices && q.choices.find(c => c.letter === q.correctChoice);
        youHtml = !youLetter
          ? '<span class="val empty">(未作答)</span>'
          : `<span class="val ${r.isCorrect ? 'right' : 'wrong'}"><b>${youLetter}.</b> ${youObj ? youObj.label : ''}</span>`;
        stdHtml = `<span class="val show"><b>${q.correctChoice}.</b> ${stdObj ? stdObj.label : ''}</span>`;
      } else {
        youHtml = r.student
          ? `<span class="val ${r.isCorrect ? 'right' : 'wrong'}">${escapeHtml(r.student)}</span>`
          : '<span class="val empty">(未作答)</span>';
        const isTexAns = looksLikeTex(r.correct);
        stdHtml = isTexAns
          ? `<span class="val show std-tex">${renderTex(r.correct)}</span>`
          : `<span class="val show fmt-code"><code>${escapeHtml(r.correct)}</code><button type="button" class="copy-btn" data-copy="${escapeHtml(r.fmt || r.correct)}">复制</button></span>`;
      }
      // 答案本身是 LaTeX 公式时，另起一行给出可照抄的"输入写法"
      const fmtRow = (looksLikeTex(r.correct) && r.fmt && !isChoiceBlank)
        ? `<div class="result-row"><span class="lbl">输入写法：</span><span class="val fmt-code"><code>${escapeHtml(r.fmt)}</code><button type="button" class="copy-btn" data-copy="${escapeHtml(r.fmt)}">复制</button></span></div>`
        : '';
      html += `
        <div class="ans-block">
          <div class="ans-block-title"><span class="ans-mark ${r.isCorrect ? 'right' : 'wrong'}">${r.isCorrect ? '✓' : '✗'}</span>${idx}${r.label}</div>
          <div class="result-row"><span class="lbl">你的答案：</span>${youHtml}</div>
          <div class="result-row"><span class="lbl">正确答案：</span>${stdHtml}</div>
          ${fmtRow}
        </div>
      `;
    });
    html += '</div>';

    // ---------- ④ 解析（关键步骤） ----------
    const hasSolution = graded.some(r => r.solution);
    if (hasSolution) {
      html += '<details class="qa-solution" open><summary class="qa-cap qa-cap-toggle">💡 解析 · 关键步骤</summary><div class="sol-body">';
      graded.forEach((r, i) => {
        if (!r.solution) return;
        const idx = qResults.length > 1 ? (['①', '②', '③', '④'][i] || (i + 1)) + ' ' : '';
        html += `<div class="sol-item"><div class="sol-lbl">${idx}${r.label}</div><div class="sol-txt">${r.solution}</div></div>`;
      });
      html += '</div></details>';
    } else if (isChoice) {
      // 无解析数据时，至少给出选择依据提示
      html += `<details class="qa-solution" open><summary class="qa-cap qa-cap-toggle">💡 解析 · 关键步骤</summary><div class="sol-body"><div class="sol-item"><div class="sol-txt">正确答案为 <b>${q.correctChoice}</b>。</div></div></div></details>`;
    }

    box.innerHTML = html;
    renderMathInElement(box);
    items.appendChild(box);
  });
}

// 把 LaTeX 片断渲染成行内公式（无 KaTeX 时降级为纯文本）
function renderTex(tex) {
  const src = String(tex == null ? '' : tex);
  if (!src) return '';
  if (typeof katex === 'undefined') return escapeHtml(src);
  try {
    return katex.renderToString(src, { throwOnError: false, output: 'html', displayMode: false });
  } catch (e) {
    return escapeHtml(src);
  }
}

// 是否按 LaTeX 渲染（含反斜杠命令 / 上标 / 下标）
function looksLikeTex(s) {
  return /\\[a-zA-Z]|\^|_\{/.test(String(s || ''));
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/* ===================== 操作 ===================== */

document.getElementById('prevBtn').addEventListener('click', () => {
  if (state.submitted) return;
  if (state.current > 0) showQuestion(state.current - 1);
});

document.getElementById('nextBtn').addEventListener('click', () => {
  if (state.submitted) return;
  if (state.current === QUESTIONS.length - 1) {
    submitAll();
  } else {
    showQuestion(state.current + 1);
  }
});

document.getElementById('restartBtn').addEventListener('click', () => {
  if (!confirm('确定重新作答？所有作答记录将被清空。')) return;
  state.answers = {};
  state.submitted = false;
  state.current = 0;
  document.getElementById('result').classList.remove('active');
  document.getElementById('navBar').style.display = '';
  const ctxEl1 = document.querySelector('.context');
  if (ctxEl1) ctxEl1.style.display = '';
  renderAllQuestions();
  showQuestion(0);
});

document.getElementById('backToCheckBtn').addEventListener('click', () => {
  state.submitted = false;
  document.getElementById('result').classList.remove('active');
  document.getElementById('navBar').style.display = '';
  const ctxEl2 = document.querySelector('.context');
  if (ctxEl2) ctxEl2.style.display = '';
  renderAllQuestions();
  showQuestion(0);
});

/* ===================== 输入写法一键复制 ===================== */
document.addEventListener('click', e => {
  const btn = e.target.closest && e.target.closest('.copy-btn');
  if (!btn) return;
  const text = btn.getAttribute('data-copy') || '';
  const flash = () => {
    const old = btn.textContent;
    btn.textContent = '已复制';
    setTimeout(() => { btn.textContent = old; }, 1200);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(flash, () => legacyCopy(text, flash));
  } else {
    legacyCopy(text, flash);
  }
});

function legacyCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) { }
  ta.remove();
  done();
}

/* ===================== 启动 ===================== */
function init() {
  // 题目背景中的公式
  const ctxEl = document.querySelector('.context-body');
  if (ctxEl) renderMathInElement(ctxEl);
  renderAllQuestions();
  showQuestion(0);

  // 联网时补传未成功的记录
  try {
    localStorage.removeItem('quiz_stu_id');
  } catch (e) { }
  if (ENABLE_COLLECT) {
    setTimeout(flushQueue, 1500);
    setInterval(flushQueue, 30000);
  }
}

if (typeof katex === 'undefined') {
  console.warn('KaTeX 加载失败，将使用纯文本显示数学公式');
  init();
} else {
  init();
}
</script>
