<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>概率论课堂测试 · 二维联合概率密度（例3.5改编）</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 60%, #faf5ff 100%);
  color: #0f172a;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.65;
}
.app {
  max-width: 760px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ===== Header ===== */
.hdr {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid #e2e8f0;
  padding: 12px 18px 10px;
  box-shadow: 0 1px 0 rgba(15, 23, 42, 0.02);
}
.hdr-title {
  font-size: 15px;
  font-weight: 600;
  color: #1e3a8a;
  letter-spacing: 0.3px;
}
.hdr-meta {
  display: flex;
  justify-content: space-between;
  font-size: 12.5px;
  color: #64748b;
  margin-top: 4px;
}
.hdr-meta .filled-good { color: #16a34a; font-weight: 500; }
.hdr-bar {
  margin-top: 8px;
  height: 4px;
  background: #e0e7ff;
  border-radius: 4px;
  overflow: hidden;
}
.hdr-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #3b82f6, #6366f1, #8b5cf6);
  width: 0%;
  transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ===== Main content ===== */
.main {
  flex: 1;
  padding: 18px 16px 110px;
}

/* ===== Question card ===== */
.q-card {
  background: white;
  border-radius: 18px;
  padding: 24px 22px;
  box-shadow: 0 4px 18px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.03);
  margin-bottom: 16px;
  display: none;
  animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.q-card.active { display: block; }
@keyframes slideIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.q-card.hidden { display: none; }
.q-section {
  font-size: 12.5px;
  color: #6366f1;
  font-weight: 600;
  letter-spacing: 0.4px;
  text-transform: none;
  margin-bottom: 8px;
}
.q-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px dashed #e2e8f0;
}
.q-title {
  font-size: 19px;
  font-weight: 700;
  color: #1e293b;
  margin: 0;
}
.q-points {
  font-size: 12px;
  font-weight: 600;
  color: #475569;
  background: #f1f5f9;
  padding: 4px 10px;
  border-radius: 8px;
}
.q-content {
  font-size: 15.5px;
  color: #334155;
}
.q-content p { margin: 14px 0; }
.q-content ul, .q-content ol {
  margin: 12px 0;
  padding-left: 22px;
}
.q-content li { margin: 4px 0; }
.q-content pre {
  background: #f8fafc;
  border-left: 3px solid #94a3b8;
  padding: 10px 14px;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 13.5px;
}
.q-content code {
  font-family: "SF Mono", Menlo, Consolas, monospace;
  background: #f1f5f9;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 13.5px;
}
.q-content table {
  border-collapse: collapse;
  margin: 12px 0;
  font-size: 14px;
}
.q-content table th, .q-content table td {
  border: 1px solid #e2e8f0;
  padding: 6px 10px;
  text-align: center;
}

/* ===== Blank input ===== */
.blank {
  display: inline-block;
  position: relative;
  margin: 0 3px;
}
.blank input {
  border: none;
  border-bottom: 2px solid #cbd5e1;
  background: #f8fafc;
  font-size: 15.5px;
  padding: 4px 12px;
  min-width: 90px;
  max-width: 240px;
  width: 140px;
  text-align: center;
  outline: none;
  transition: all 0.2s;
  font-family: inherit;
  border-radius: 6px 6px 0 0;
  color: #0f172a;
}
.blank input::placeholder {
  color: #cbd5e1;
  font-style: italic;
}
.blank input:focus {
  border-bottom-color: #3b82f6;
  background: #eff6ff;
}
.blank input:disabled {
  background: transparent;
  cursor: not-allowed;
}
.blank input.correct {
  background: #dcfce7;
  border-bottom-color: #16a34a;
  color: #166534;
  font-weight: 600;
}
.blank input.wrong {
  background: #fee2e2;
  border-bottom-color: #dc2626;
  color: #991b1b;
  text-decoration: line-through;
  text-decoration-thickness: 1.5px;
}
.blank-extra {
  position: absolute;
  right: -10px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 11px;
  font-weight: 600;
  padding: 1px 5px;
  border-radius: 4px;
  opacity: 0.9;
  pointer-events: none;
}
.blank-extra.correct { background: #16a34a; color: white; }
.blank-extra.wrong { background: #dc2626; color: white; }

/* ===== Choice options ===== */
.choices {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 14px;
}
.choice {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 14px;
  background: #f8fafc;
  border: 2px solid #e2e8f0;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 15px;
  user-select: none;
}
.choice:hover { border-color: #93c5fd; background: #f0f9ff; }
.choice.selected {
  border-color: #3b82f6;
  background: #eff6ff;
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
}
.choice input { margin-top: 4px; accent-color: #3b82f6; }
.choice .letter {
  font-weight: 700;
  color: #1e40af;
  min-width: 18px;
}
.choice.correct {
  background: #dcfce7;
  border-color: #16a34a;
}
.choice.wrong {
  background: #fee2e2;
  border-color: #dc2626;
}
.choice.disabled { cursor: not-allowed; }
.choice.disabled:hover { border-color: #e2e8f0; background: #f8fafc; }
.choice.correct-mark::after {
  content: '✓';
  margin-left: auto;
  color: #16a34a;
  font-weight: 700;
  font-size: 18px;
}

/* ===== Navigation bar ===== */
.nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid #e2e8f0;
  padding: 12px 16px max(12px, env(safe-area-inset-bottom));
  display: flex;
  gap: 10px;
  z-index: 50;
  box-shadow: 0 -4px 16px rgba(15, 23, 42, 0.05);
}
.btn {
  flex: 1;
  padding: 12px 18px;
  border-radius: 12px;
  border: none;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
  outline: none;
}
.btn:active { transform: scale(0.97); }
.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.btn:disabled:active { transform: none; }
.btn-pri {
  background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
  color: white;
  box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
}
.btn-pri:hover:not(:disabled) {
  box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
  transform: translateY(-1px);
}
.btn-pri:active:not(:disabled) { transform: translateY(0); }
.btn-sec {
  background: #e2e8f0;
  color: #475569;
}
.btn-sec:hover:not(:disabled) {
  background: #cbd5e1;
}
.btn-success {
  background: linear-gradient(135deg, #10b981 0%, #059669 100%);
  color: white;
  box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
}
.btn-success:hover:not(:disabled) {
  box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
  transform: translateY(-1px);
}

/* ===== Result page ===== */
.result {
  display: none;
  padding: 6px 4px;
}
.result.active { display: block; }
.result-summary {
  background: white;
  border-radius: 18px;
  padding: 32px 20px;
  text-align: center;
  box-shadow: 0 6px 24px rgba(15, 23, 42, 0.07);
  margin-bottom: 18px;
}
.score-circle {
  --pct: 0;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: conic-gradient(
    #10b981 0deg calc(var(--pct) * 3.6deg),
    #e2e8f0 calc(var(--pct) * 3.6deg) 360deg
  );
  margin: 0 auto 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  animation: spinLoad 0.8s cubic-bezier(0.4, 0, 0.2, 1);
}
@keyframes spinLoad {
  from { transform: rotate(-90deg); opacity: 0; }
  to { transform: rotate(0); opacity: 1; }
}
.score-circle::before {
  content: '';
  position: absolute;
  inset: 10px;
  border-radius: 50%;
  background: white;
}
.score-value {
  position: relative;
  font-size: 42px;
  font-weight: 800;
  color: #0f172a;
  line-height: 1;
}
.score-value small {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: #64748b;
  margin-top: 4px;
}
.result-title {
  font-size: 22px;
  margin: 0 0 6px;
  font-weight: 700;
  color: #1e293b;
}
.result-subtitle {
  font-size: 14px;
  color: #64748b;
  margin: 0 0 16px;
}
.result-stats {
  display: flex;
  justify-content: center;
  gap: 28px;
  padding-top: 16px;
  border-top: 1px dashed #e2e8f0;
}
.stat {
  text-align: center;
}
.stat strong {
  display: block;
  font-size: 22px;
  font-weight: 700;
  color: #1e40af;
}
.stat span {
  font-size: 12px;
  color: #64748b;
}
.stat-good strong { color: #16a34a; }
.stat-bad strong { color: #dc2626; }

/* Result list */
.result-list {
  background: white;
  border-radius: 18px;
  box-shadow: 0 4px 18px rgba(15, 23, 42, 0.06);
  overflow: hidden;
  margin-bottom: 16px;
}
.result-list-title {
  padding: 16px 18px 4px;
  font-size: 14px;
  font-weight: 600;
  color: #64748b;
  letter-spacing: 0.5px;
}
.result-item {
  padding: 16px 18px;
  border-top: 1px solid #f1f5f9;
}
.result-item-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.result-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  font-size: 14px;
  font-weight: 700;
  color: white;
  flex-shrink: 0;
}
.result-badge.right { background: #16a34a; }
.result-badge.wrong { background: #dc2626; }
.result-qtitle { font-weight: 600; font-size: 15px; color: #1e293b; }
.result-qpoints {
  font-size: 12px;
  color: #64748b;
  background: #f1f5f9;
  padding: 2px 8px;
  border-radius: 6px;
  margin-left: auto;
}
.result-detail {
  padding-left: 36px;
  font-size: 13.5px;
  color: #475569;
}
.result-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin: 5px 0;
  line-height: 1.5;
}
.result-row .lbl {
  min-width: 60px;
  flex-shrink: 0;
  color: #64748b;
  font-size: 13px;
  padding-top: 1px;
}
.result-row .val {
  flex: 1;
  font-family: "SF Mono", Menlo, Consolas, monospace;
  font-size: 13.5px;
  word-break: break-word;
}
.result-row .val.empty { color: #94a3b8; font-style: italic; }
.result-row .val.right { color: #16a34a; }
.result-row .val.wrong { color: #dc2626; text-decoration: line-through; }
.result-row .val.show { color: #16a34a; font-weight: 600; }

.result-actions {
  display: flex;
  gap: 10px;
  margin-top: 8px;
}
.result-actions .btn { flex: 1; }

/* ===== 逐题解析卡片（原题 + 作答对照 + 关键步骤） ===== */
.result-q {
  background: white;
  border-radius: 16px;
  box-shadow: 0 4px 18px rgba(15, 23, 42, 0.06);
  border-top: 3px solid #e2e8f0;
  padding: 16px 18px 18px;
  margin-bottom: 14px;
}
.result-q.all-right { border-top-color: #10b981; }
.result-q.part-right { border-top-color: #f59e0b; }
.result-q.all-wrong { border-top-color: #ef4444; }
.result-q-head {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.result-badge.part { background: #f59e0b; }
.result-qsection {
  font-size: 12px;
  color: #94a3b8;
}
.qa-cap {
  font-size: 12.5px;
  font-weight: 700;
  color: #475569;
  letter-spacing: 0.4px;
  margin: 16px 0 8px;
}
.qa-cap-toggle {
  list-style: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  user-select: none;
}
.qa-cap-toggle::-webkit-details-marker { display: none; }
.qa-cap-toggle::after {
  content: '▾';
  font-size: 11px;
  color: #94a3b8;
  transition: transform 0.2s;
}
.qa-solution:not([open]) .qa-cap-toggle::after { transform: rotate(-90deg); }
.qa-solution:not([open]) .qa-cap-toggle { margin-bottom: 0; }

/* 原题 */
.qa-origin {
  background: #f8fafc;
  border: 1px solid #eef2f7;
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 14.5px;
  color: #334155;
  line-height: 1.75;
  overflow-x: auto;
}
.qa-origin p { margin: 8px 0; }
.inline-ans {
  display: inline-block;
  min-width: 60px;
  padding: 1px 9px;
  border-radius: 7px;
  font-family: "SF Mono", Menlo, Consolas, monospace;
  font-size: 13.5px;
  text-align: center;
  border-bottom: 2px solid #cbd5e1;
  background: #eef2f7;
  color: #334155;
}
.inline-ans.right { color: #15803d; background: #dcfce7; border-bottom-color: #16a34a; }
.inline-ans.wrong { color: #b91c1c; background: #fee2e2; border-bottom-color: #dc2626; }
.inline-ans.empty { color: #94a3b8; font-style: italic; background: #f1f5f9; }

/* 原题中的选项 */
.origin-choices {
  list-style: none;
  padding: 0;
  margin: 12px 0 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.origin-choices li {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 8px;
  padding: 8px 12px;
  border-radius: 10px;
  background: white;
  border: 1px solid #e2e8f0;
  font-size: 14px;
  color: #334155;
}
.origin-choices li.correct-opt {
  border-color: #16a34a;
  background: #f0fdf4;
}
.origin-choices li.picked-wrong {
  border-color: #dc2626;
  background: #fef2f2;
}
.opt-tag {
  margin-left: auto;
  font-size: 11.5px;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: 5px;
  white-space: nowrap;
}
.opt-tag.t-right { background: #16a34a; color: white; }
.opt-tag.t-wrong { background: #dc2626; color: white; }
.opt-tag.t-std { background: #e2e8f0; color: #475569; }

/* 作答对照 */
.qa-answers { display: flex; flex-direction: column; gap: 8px; }
.ans-block {
  background: #f8fafc;
  border-radius: 11px;
  padding: 10px 12px;
}
.ans-block-title {
  font-size: 13px;
  font-weight: 600;
  color: #475569;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.ans-mark { font-weight: 700; }
.ans-mark.right { color: #16a34a; }
.ans-mark.wrong { color: #dc2626; }
.ans-block .result-row { padding-left: 0; }


/* 解析 */
.qa-solution .sol-body {
  background: linear-gradient(135deg, #f0f9ff 0%, #f5f3ff 100%);
  border: 1px solid #e0e7ff;
  border-radius: 12px;
  padding: 12px 14px;
}
.sol-item + .sol-item { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #dbeafe; }
.sol-lbl {
  font-size: 12.5px;
  font-weight: 700;
  color: #4338ca;
  margin-bottom: 4px;
}
.sol-txt {
  font-size: 14px;
  color: #334155;
  line-height: 1.8;
  overflow-x: auto;
}

/* KaTeX overflow */
.katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
.katex-display > .katex { display: inline-block; }

/* ===== Context (题目背景) ===== */
.context {
  background: linear-gradient(135deg, #fefce8 0%, #fef9c3 100%);
  border: 1px solid #fde68a;
  border-radius: 14px;
  margin-bottom: 16px;
  overflow: hidden;
}
.context summary {
  padding: 12px 16px;
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  color: #92400e;
  list-style: none;
  user-select: none;
  display: flex;
  align-items: center;
  gap: 6px;
}
.context summary::-webkit-details-marker { display: none; }
.context summary::before {
  content: '▸';
  display: inline-block;
  transition: transform 0.2s;
  font-size: 12px;
}
.context[open] summary::before { transform: rotate(90deg); }
.context-body {
  padding: 4px 18px 16px;
  font-size: 14px;
  color: #422006;
  line-height: 1.75;
}
.context-body p { margin: 10px 0; }

/* Responsive */
@media (max-width: 480px) {
  .q-card { padding: 20px 16px; border-radius: 14px; }
  .q-title { font-size: 17px; }
  .q-content { font-size: 15px; }
  .blank input { width: 110px; font-size: 14.5px; }
  .header { padding: 10px 14px 8px; }
  .hdr-title { font-size: 14px; }
  .score-circle { width: 130px; height: 130px; }
  .score-value { font-size: 36px; }
  .result-q { padding: 14px 13px 16px; border-radius: 14px; }
  .qa-origin { font-size: 14px; padding: 10px 11px; }
  .qa-solution .sol-body { padding: 10px 11px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <div class="hdr-title">概率论课堂测试 · 二维联合概率密度</div>
    <div class="hdr-meta">
      <span id="progress">第 1 / 8 题</span>
      <span id="filled">已作答 0 / 11</span>
    </div>
    <div class="hdr-bar"><div class="hdr-bar-fill" id="barFill" style="width: 0%"></div></div>
  </header>

  <main class="main" id="main">
    <details class="context" open>
      <summary>📋 题目背景（点击展开）</summary>
      <div class="context-body">
        <p>设二维随机变量 $(X, Y)$ 的联合概率密度为</p>
        <p>$$f(x,y)=\begin{cases} A(x+y), & 0&lt;x&lt;2,\;0&lt;y&lt;3,\\ 0, & \text{其他}. \end{cases}$$</p>
        <p>下面 8 道题将围绕该概率密度进行考查：常数 $A$ 的确定、特定事件概率的计算以及积分顺序的交换。</p>
      </div>
    </details>

    <div id="cards"></div>

    <!-- Result page -->
    <div class="result" id="result">
      <div class="result-summary">
        <div class="score-circle" id="scoreCircle">
          <div class="score-value">
            <span id="scoreVal">0</span>
            <small>分（百分制）</small>
          </div>
        </div>
        <h2 class="result-title" id="resultTitle">继续保持！</h2>
        <p class="result-subtitle" id="resultSubtitle">回顾下方逐题解析，巩固薄弱环节。</p>
        <div class="result-stats">
          <div class="stat stat-good"><strong id="statRight">0</strong><span>答对</span></div>
          <div class="stat stat-bad"><strong id="statWrong">0</strong><span>答错</span></div>
          <div class="stat"><strong id="statTotal">11</strong><span>总空数</span></div>

/* ===================== 评分相关 ===================== */

// 归一化：去首尾空格、内部空白折叠
function normalize(s) {
  if (s == null) return '';
  return String(s).trim().replace(/\s+/g, '');
}

// 解析纯数字（或纯数字表达式，如 1/5、0.2、3.14、-2）
function tryParseNumber(s) {
  if (!s) return null;
  if (/[a-zA-Z\u0370-\u03ff]/.test(s)) return null; // 跳过含字母/希腊字母
  // 替换 \pi \e 等
  const cleaned = s
    .replace(/\\pi/g, 'Math.PI')
    .replace(/\\mathrm\{e\}/g, 'Math.E')
    .replace(/\\e(?![a-zA-Z])/g, 'Math.E');
  try {
    const v = Function('"use strict"; return (' + cleaned + ')')();
    if (typeof v === 'number' && !isNaN(v) && isFinite(v)) return v;
  } catch (e) {}
  return null;
}

// 解析含单变量（x 或 y）的表达式（多点取值，判断多项式是否相等）
function tryParseExpression(s) {
  if (!s) return null;
  const lower = s.toLowerCase();
  const hasX = /(?<![a-zA-Z])x(?![a-zA-Z])/.test(lower);
  const hasY = /(?<![a-zA-Z])y(?![a-zA-Z])/.test(lower);
  if (!hasX && !hasY) return null;
  if (hasX && hasY) return null; // 二元表达式不支持，交由字符串比较
  try {
    // 若只含 y，先统一替换为 x
    let src = hasY && !hasX
      ? s.replace(/(?<![a-zA-Z])y(?![a-zA-Z])/gi, 'x')
      : s;
    let cleaned = src
      .replace(/\\left|\\right/g, '')
      .replace(/\\mathrm\{d\}/g, '')
      .replace(/\\,|\\!|\\;/g, '')
      .replace(/\s+/g, '')
      .replace(/\^/g, '**')
      .replace(/\\d?frac\{([^{}]+)\}\{([^{}]+)\}/g, '(($1)/($2))')
      .replace(/\\/g, '');
    const testValues = [0, 1, 2, -1, 0.5, 1.5, 3];
    const results = testValues.map(xv => {
      let expr = cleaned
        .replace(/(?<![a-zA-Z])x(?![a-zA-Z])/gi, '(' + xv + ')')
        .replace(/(\d)\(/g, '$1*(')   // 隐式乘法: 3( → 3*(
        .replace(/\)(\d)/g, ')*$1')   // 隐式乘法: )3 → )*3
        .replace(/\)\(/g, ')*(');     // 隐式乘法: )( → )*(
      return Function('"use strict"; return (' + expr + ')')();
    });
    if (results.every(r => typeof r === 'number' && !isNaN(r) && isFinite(r))) {
      return results;
    }
  } catch (e) {}
  return null;
}

// 比较两个答案
function answersMatch(student, correct) {
  const s = normalize(student);
  const c = normalize(correct);
  if (!s || !c) return false;
  if (s === c) return true;

  // 抽取 LaTeX 数学片段（比如 \frac{1}{2}）作为归一化对比
  // 直接归一：去除 \dfrac、\!、\, 等格式符号
  function stripLatex(x) {
    return x
      .replace(/\\dfrac/g, '\\frac')
      .replace(/\\!/g, '')
      .replace(/\\,/g, '')
      .replace(/\\;/g, '')
      .replace(/\\left/g, '')
      .replace(/\\right/g, '')
      .replace(/\\mathrm\{([^}]+)\}/g, '$1')
      .replace(/\\,|\!|\;/g, '')
      .replace(/\s+/g, '')
      .toLowerCase();
  }
  if (stripLatex(s) === stripLatex(c)) return true;

  // 数字等价（含分数/小数互换）
  const sNum = tryParseNumber(s);
  const cNum = tryParseNumber(c);
  if (sNum !== null && cNum !== null && Math.abs(sNum - cNum) < 1e-6) return true;

  // 表达式等价（多个点测试）
  const sExpr = tryParseExpression(s);
  const cExpr = tryParseExpression(c);
  if (sExpr && cExpr && sExpr.length === cExpr.length) {
    let match = true;
    for (let i = 0; i < sExpr.length; i++) {
      if (typeof sExpr[i] !== 'number' || Math.abs(sExpr[i] - cExpr[i]) > 1e-5) {
        match = false;
        break;
      }
    }
    if (match) return true;
  }

  return false;
}

/* ===================== KaTeX 渲染 ===================== */

function renderMathInElement(root) {
  if (typeof katex === 'undefined') return; // 兜底

  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      // 跳过 KaTeX 已渲染的内容
      let p = node.parentNode;
      while (p && p !== root) {
        if (p.classList && (p.classList.contains('katex') || p.classList.contains('katex-display'))) {
          return NodeFilter.FILTER_REJECT;
        }
        p = p.parentNode;
      }
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const textNodes = [];
  let n;
  while ((n = walker.nextNode())) textNodes.push(n);

  textNodes.forEach(node => {
    const text = node.nodeValue;
    if (text.indexOf('$') < 0) return;

    // 解析为 segments
    const segs = [];
    let i = 0;
    while (i < text.length) {
      if (text[i] === '$') {
        if (text[i + 1] === '$') {
          const end = text.indexOf('$$', i + 2);
          if (end > i + 2) {
            segs.push({ type: 'display', tex: text.substring(i + 2, end) });
            i = end + 2;
            continue;
          }
        }
        const end = text.indexOf('$', i + 1);
        if (end > i + 1) {
          segs.push({ type: 'inline', tex: text.substring(i + 1, end) });
          i = end + 1;
          continue;
        }
        // 孤立的 $（无配对）：作为普通文本处理，避免死循环
        segs.push({ type: 'text', content: '$' });
        i++;
        continue;
      }
      let j = i;
      while (j < text.length && text[j] !== '$') j++;
      segs.push({ type: 'text', content: text.substring(i, j) });
      i = j;
    }

    const temp = document.createElement('span');
    segs.forEach(seg => {
      if (seg.type === 'text') {
        temp.appendChild(document.createTextNode(seg.content));
      } else {
        try {
          const html = katex.renderToString(seg.tex, {
            throwOnError: false,
            displayMode: seg.type === 'display',
            output: 'html' // 不输出 MathML，避免部分浏览器显示多余的纯文本公式行
          });
          const wrap = document.createElement('span');
          wrap.innerHTML = html;
          while (wrap.firstChild) temp.appendChild(wrap.firstChild);
        } catch (e) {
          temp.appendChild(document.createTextNode(
            (seg.type === 'display' ? '$$' : '$') + seg.tex +
            (seg.type === 'display' ? '$$' : '$')
          ));
        }
      }
    });
    if (node.parentNode) {
      node.parentNode.replaceChild(temp, node);
    }
  });
}

/* ===================== 应用状态 ===================== */
const state = {
  current: 0,
  answers: {}, // { 'bid': '用户输入' }
  submitted: false
};

/* ===================== 题目渲染 ===================== */

function buildQuestionCard(q, idx) {
  const card = document.createElement('article');
  card.className = 'q-card';
  card.dataset.qid = q.id;

  const head = document.createElement('div');
  head.className = 'q-head';
  head.innerHTML = `
    <h2 class="q-title">${q.title}</h2>
    <span class="q-points">${q.points} 分</span>
  `;

  const section = document.createElement('div');
  section.className = 'q-section';
  // 渲染 section 中的 LaTeX
  section.innerHTML = q.section;
  renderMathInElement(section);

  const content = document.createElement('div');
  content.className = 'q-content';
  content.innerHTML = q.content;
  renderMathInElement(content);

  card.appendChild(section);
  card.appendChild(head);
  card.appendChild(content);

  // 选择题 / 判断题
  if (q.type === 'choice' || q.type === 'judge') {
    const wrap = document.createElement('div');
    wrap.className = 'choices';
    q.choices.forEach(c => {
      const id = 'q' + q.id + '-' + c.letter;
      const item = document.createElement('label');
      item.className = 'choice';
      item.dataset.letter = c.letter;
      item.innerHTML = `
        <input type="radio" name="q${q.id}" id="${id}" value="${c.letter}">
        <span class="letter">${c.letter}.</span>
        <span class="choice-text"></span>
      `;
      item.querySelector('.choice-text').innerHTML = c.label;
      renderMathInElement(item.querySelector('.choice-text'));

      const radio = item.querySelector('input');
      radio.addEventListener('change', () => {
        if (state.submitted) return;
        state.answers[q.blanks[0].key] = c.letter;
        wrap.querySelectorAll('.choice').forEach(el => el.classList.remove('selected'));
        item.classList.add('selected');
        updateProgress();
      });

      // restore
      if (state.answers[q.blanks[0].key] === c.letter) {
        radio.checked = true;
        item.classList.add('selected');
      }

      // 提交后样式
      if (state.submitted) {
        radio.disabled = true;
        item.classList.add('disabled');
        if (c.letter === q.correctChoice) item.classList.add('correct', 'correct-mark');
        if (state.answers[q.blanks[0].key] === c.letter && c.letter !== q.correctChoice) {
          item.classList.add('wrong');
        }
      }

      wrap.appendChild(item);
    });
    card.appendChild(wrap);
  }

  // 填空题：把 <span class="blank-slot"> 替换为 input
  const slots = card.querySelectorAll('.blank-slot');
  slots.forEach(span => {
    const bid = span.getAttribute('data-bid');
    const blank = q.blanks.find(b => b.key === bid);
    const value = state.answers[bid] || '';

    const wrap = document.createElement('span');
    wrap.className = 'blank';

    const input = document.createElement('input');
    input.type = 'text';
    input.value = value;
    input.placeholder = '?';
    input.dataset.bid = bid;
    input.autocomplete = 'off';
    input.spellcheck = false;

    input.addEventListener('input', e => {
      if (state.submitted) return;
      state.answers[bid] = e.target.value;
      updateProgress();
    });

    wrap.appendChild(input);

    if (state.submitted) {
      input.disabled = true;
      const correct = answersMatch(value, blank.correct);
      if (correct) {
        input.classList.add('correct');
      } else {
        input.classList.add('wrong');
        const tag = document.createElement('span');
        tag.className = 'blank-extra correct';
        tag.textContent = '✓ ' + blank.correct;
        wrap.appendChild(tag);
      }
    }

    span.replaceWith(wrap);
  });

  return card;
}

function renderAllQuestions() {
  const container = document.getElementById('cards');
  container.innerHTML = '';
  QUESTIONS.forEach((q, idx) => {
    const card = buildQuestionCard(q, idx);
    if (idx === state.current) card.classList.add('active');
    container.appendChild(card);
  });
}

function showQuestion(idx) {
  state.current = Math.max(0, Math.min(QUESTIONS.length - 1, idx));
  const cards = document.querySelectorAll('.q-card');
  cards.forEach((c, i) => {
    if (i === state.current) c.classList.add('active');
    else c.classList.remove('active');
  });
  document.getElementById('main').scrollTo({ top: 0, behavior: 'smooth' });
  window.scrollTo({ top: 0, behavior: 'smooth' });
  updateProgress();
  updateNavButtons();
}

function updateProgress() {
  const cur = state.current + 1;
  const total = QUESTIONS.length;
  document.getElementById('progress').textContent = `第 ${cur} / ${total} 题`;
  document.getElementById('barFill').style.width = (cur / total * 100) + '%';

  const filled = QUESTIONS.reduce((sum, q) => {
    return sum + q.blanks.filter(b => (state.answers[b.key] || '').trim()).length;
  }, 0);
  const filledEl = document.getElementById('filled');
  filledEl.textContent = `已作答 ${filled} / ${TOTAL_BLANKS}`;
  if (filled === TOTAL_BLANKS) {
    filledEl.classList.add('filled-good');
  } else {
    filledEl.classList.remove('filled-good');
  }
}

function updateNavButtons() {
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  prevBtn.disabled = state.current === 0;
  if (state.current === QUESTIONS.length - 1) {
    nextBtn.textContent = '✓ 提交查看结果';
    nextBtn.classList.remove('btn-pri');
    nextBtn.classList.add('btn-success');
  } else {
    nextBtn.textContent = '下一题 →';
    nextBtn.classList.add('btn-pri');
    nextBtn.classList.remove('btn-success');
  }
}

/* ===================== 提交与判分 ===================== */

function submitAll() {
  if (!confirm('确定要提交吗？提交后无法修改。')) return;
  state.submitted = true;
  document.getElementById('prevBtn').disabled = true;
  document.getElementById('nextBtn').disabled = true;
  // 顶部进度改为完成状态
  document.getElementById('progress').textContent = '测试已完成';
  document.getElementById('barFill').style.width = '100%';
  const { correctCount } = gradeAnswers();
  const filledEl = document.getElementById('filled');
  filledEl.textContent = `得分 ${Math.round(correctCount / TOTAL_BLANKS * 100)} 分（${correctCount} / ${TOTAL_BLANKS} 空）`;
  filledEl.classList.add('filled-good');
  renderResult();
}

function gradeAnswers() {
  const results = [];
  let correctCount = 0;
  QUESTIONS.forEach(q => {
    q.blanks.forEach(b => {
      const studentAns = state.answers[b.key] || '';
      const isCorrect = answersMatch(studentAns, b.correct);
      if (isCorrect) correctCount++;
      results.push({
        qId: q.id,
        key: b.key,
        qTitle: q.title,
        qPoints: q.points,
        qSection: q.section,
        qType: q.type,
        correctChoice: q.correctChoice,
        label: b.label,
        correct: b.correct,
        solution: b.solution || '',
        student: studentAns,
        isCorrect
      });
    });
  });
  return { results, correctCount };
}

function renderResult() {
  const { results, correctCount } = gradeAnswers();
  const total = TOTAL_BLANKS;
  const score = Math.round(correctCount / total * 100);
  const wrongCount = total - correctCount;

  // 隐藏题目卡片、显示结果页
  document.querySelectorAll('.q-card').forEach(c => c.classList.add('hidden'));
  document.getElementById('result').classList.add('active');
  document.getElementById('navBar').style.display = 'none';
  const ctxEl = document.querySelector('.context');
  if (ctxEl) ctxEl.style.display = 'none';

  // 分数
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('scoreCircle').style.setProperty('--pct', score);
  document.getElementById('statRight').textContent = correctCount;
  document.getElementById('statWrong').textContent = wrongCount;
  document.getElementById('statTotal').textContent = total;

  // 评语
  const title = document.getElementById('resultTitle');
  const subtitle = document.getElementById('resultSubtitle');
  if (score >= 90) {
    title.textContent = '🏆 优秀！';
    subtitle.textContent = '掌握得非常扎实，可向更高难度挑战。';
  } else if (score >= 75) {
    title.textContent = '👍 良好';
    subtitle.textContent = '整体不错，部分细节仍可进一步完善。';
  } else if (score >= 60) {
    title.textContent = '🌱 及格';
    subtitle.textContent = '基础已有，建议回顾题目背景与关键计算步骤。';
  } else {
    title.textContent = '📚 加油';
    subtitle.textContent = '别灰心，先把题目背景与公式再读一遍，再做一遍。';
  }

  // 渲染逐题结果：原题 + 作答对照 + 解析（关键步骤）
  const items = document.getElementById('resultItems');
  items.innerHTML = '';

  QUESTIONS.forEach(q => {
    const qResults = results.filter(r => r.qId === q.id);
    if (!qResults.length) return;

    const rightCount = qResults.filter(r => r.isCorrect).length;
    const allRight = rightCount === qResults.length;
    const allWrong = rightCount === 0;
    const isChoice = (q.type === 'choice' || q.type === 'judge');

    const box = document.createElement('div');
    box.className = 'result-q ' + (allRight ? 'all-right' : (allWrong ? 'all-wrong' : 'part-right'));

    // ---------- ① 头部 ----------
    let html = `
      <div class="result-q-head">
        <span class="result-badge ${allRight ? 'right' : (allWrong ? 'wrong' : 'part')}">${allRight ? '✓' : (allWrong ? '✗' : '±')}</span>
        <span class="result-qtitle">${escapeHtml(q.title)}</span>
        <span class="result-qsection">${q.section}</span>
        <span class="result-qpoints">${q.points} 分 · 答对 ${rightCount}/${qResults.length} 空</span>
      </div>
    `;

    // ---------- ② 原题（把空位替换为学生作答） ----------
    let originContent = q.content;
    qResults.forEach(r => {
      const escKey = r.key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const re = new RegExp('<span class="blank-slot" data-bid="' + escKey + '"></span>', 'g');
      const ansTxt = r.student ? escapeHtml(r.student) : '未作答';
      originContent = originContent.replace(
        re,
        `<span class="inline-ans ${r.student ? (r.isCorrect ? 'right' : 'wrong') : 'empty'}">${ansTxt}</span>`
      );
    });

    let choicesHtml = '';
    if (isChoice && q.choices) {
      const picked = (qResults[0].student || '').toUpperCase();
      choicesHtml = '<ul class="origin-choices">' + q.choices.map(c => {
        const isPicked = picked === c.letter;
        const isStd = q.correctChoice === c.letter;
        const cls = isStd ? 'correct-opt' : (isPicked ? 'picked-wrong' : '');
        let tag = '';
        if (isStd && isPicked) tag = '<span class="opt-tag t-right">你选对了</span>';
        else if (isStd) tag = '<span class="opt-tag t-std">正确答案</span>';
        else if (isPicked) tag = '<span class="opt-tag t-wrong">你选择</span>';
        return `<li class="${cls}"><b>${c.letter}.</b><span class="opt-body">${c.label}</span>${tag}</li>`;
      }).join('') + '</ul>';
    }

    html += `
      <div class="qa-cap">📄 原题</div>
      <div class="qa-origin">${originContent}${choicesHtml}</div>
    `;

    // ---------- ③ 作答对照 ----------
    html += '<div class="qa-cap">✍️ 作答对照</div><div class="qa-answers">';
    qResults.forEach((r, i) => {
      const idx = qResults.length > 1 ? (['①', '②', '③', '④'][i] || (i + 1)) + ' ' : '';
      let youHtml, stdHtml;
      if (isChoice) {
        const youLetter = (r.student || '').toUpperCase();
        const youObj = q.choices && q.choices.find(c => c.letter === youLetter);
        const stdObj = q.choices && q.choices.find(c => c.letter === q.correctChoice);
        youHtml = !youLetter
          ? '<span class="val empty">(未作答)</span>'
          : `<span class="val ${r.isCorrect ? 'right' : 'wrong'}"><b>${youLetter}.</b> ${youObj ? youObj.label : ''}</span>`;
        stdHtml = `<span class="val show"><b>${q.correctChoice}.</b> ${stdObj ? stdObj.label : ''}</span>`;
      } else {
        youHtml = r.student
          ? `<span class="val ${r.isCorrect ? 'right' : 'wrong'}">${escapeHtml(r.student)}</span>`
          : '<span class="val empty">(未作答)</span>';
        stdHtml = `<span class="val show">${escapeHtml(r.correct)}</span>`;
      }
      html += `
        <div class="ans-block">
          <div class="ans-block-title"><span class="ans-mark ${r.isCorrect ? 'right' : 'wrong'}">${r.isCorrect ? '✓' : '✗'}</span>${idx}${r.label}</div>
          <div class="result-row"><span class="lbl">你的答案：</span>${youHtml}</div>
          <div class="result-row"><span class="lbl">正确答案：</span>${stdHtml}</div>
        </div>
      `;
    });
    html += '</div>';

    // ---------- ④ 解析（关键步骤） ----------
    const hasSolution = qResults.some(r => r.solution);
    if (hasSolution) {
      html += '<details class="qa-solution" open><summary class="qa-cap qa-cap-toggle">💡 解析 · 关键步骤</summary><div class="sol-body">';
      qResults.forEach((r, i) => {
        if (!r.solution) return;
        const idx = qResults.length > 1 ? (['①', '②', '③', '④'][i] || (i + 1)) + ' ' : '';
        html += `<div class="sol-item"><div class="sol-lbl">${idx}${r.label}</div><div class="sol-txt">${r.solution}</div></div>`;
      });
      html += '</div></details>';
    } else if (isChoice) {
      // 无解析数据时，至少给出选择依据提示
      html += `<details class="qa-solution" open><summary class="qa-cap qa-cap-toggle">💡 解析 · 关键步骤</summary><div class="sol-body"><div class="sol-item"><div class="sol-txt">正确答案为 <b>${q.correctChoice}</b>。</div></div></div></details>`;
    }

    box.innerHTML = html;
    renderMathInElement(box);
    items.appendChild(box);
  });
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/* ===================== 操作 ===================== */

document.getElementById('prevBtn').addEventListener('click', () => {
  if (state.submitted) return;
  if (state.current > 0) showQuestion(state.current - 1);
});

document.getElementById('nextBtn').addEventListener('click', () => {
  if (state.submitted) return;
  if (state.current === QUESTIONS.length - 1) {
    submitAll();
  } else {
    showQuestion(state.current + 1);
  }
});

document.getElementById('restartBtn').addEventListener('click', () => {
  if (!confirm('确定重新作答？所有作答记录将被清空。')) return;
  state.answers = {};
  state.submitted = false;
  state.current = 0;
  document.getElementById('result').classList.remove('active');
  document.getElementById('navBar').style.display = '';
  const ctxEl1 = document.querySelector('.context');
  if (ctxEl1) ctxEl1.style.display = '';
  renderAllQuestions();
  showQuestion(0);
});

document.getElementById('backToCheckBtn').addEventListener('click', () => {
  state.submitted = false;
  document.getElementById('result').classList.remove('active');
  document.getElementById('navBar').style.display = '';
  const ctxEl2 = document.querySelector('.context');
  if (ctxEl2) ctxEl2.style.display = '';
  renderAllQuestions();
  showQuestion(0);
});

/* ===================== 启动 ===================== */
function init() {
  // 题目背景中的公式
  const ctxEl = document.querySelector('.context-body');
  if (ctxEl) renderMathInElement(ctxEl);
  renderAllQuestions();
  showQuestion(0);
}

if (typeof katex === 'undefined') {
  console.warn('KaTeX 加载失败，将使用纯文本显示数学公式');
  init();
} else {
  init();
}
</script>
