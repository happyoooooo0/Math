<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日学习打卡（可上传图片）</title>
<style>
*{box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif;margin:0;padding:0}
body{background:#f0f4f8;padding:20px}
.container{max-width:500px;margin:0 auto;background:#fff;padding:24px;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,0.08)}
h2{text-align:center;color:#2d3748;margin-bottom:20px}
.item{margin-bottom:14px}
label{display:block;margin-bottom:6px;color:#4a5568}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid #cbd5e0;border-radius:8px;font-size:15px}
textarea{min-height:90px;resize:vertical}
button{width:100%;padding:12px;background:#3182ce;color:#fff;border:none;border-radius:8px;font-size:16px;margin-top:8px}
button:hover{background:#2b6cb0}
.record-title{margin-top:24px;margin-bottom:10px;color:#2d3748;font-weight:bold}
.record-item{padding:12px;border-bottom:1px solid #e2e8f0;font-size:14px;line-height:1.6}
.date-text{color:#718096;font-size:13px;margin-bottom:4px}
.img-preview{max-width:100%;max-height:200px;margin-top:8px;border-radius:6px}
</style>
</head>
<body>
<div class="container">
  <h2>📚 每日学习打卡</h2>

  <div class="item">
    <label>今日学习时长</label>
    <select id="time">
      <option>1小时以内</option>
      <option>1-2小时</option>
      <option>2-4小时</option>
      <option>4小时以上</option>
    </select>
  </div>

  <div class="item">
    <label>今日学习内容</label>
    <textarea id="content" placeholder="刷题、背单词、整理笔记、看书..."></textarea>
  </div>

  <div class="item">
    <label>今日收获总结</label>
    <textarea id="summary" placeholder="简单写两句今天学到了什么"></textarea>
  </div>

  <div class="item">
    <label>上传学习照片（笔记/书桌/截图）</label>
    <input type="file" id="imgInput" accept="image/*" onchange="previewImg(event)">
    <img id="preview" class="img-preview" style="display:none;">
  </div>

  <button onclick="checkIn()">✅ 提交今日打卡</button>

  <div class="record-title">📋 历史打卡记录</div>
  <div id="recordList"></div>
</div>

<script>
let records = JSON.parse(localStorage.getItem("studyRecords") || "[]");
let imgBase64 = "";

// 预览图片
function previewImg(e) {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    imgBase64 = ev.target.result;
    document.getElementById("preview").src = imgBase64;
    document.getElementById("preview").style.display = "block";
  }
  reader.readAsDataURL(file);
}

// 渲染记录
function render() {
  let html = "";
  records.forEach(r => {
    let imgHtml = r.img ? `<img src="${r.img}" class="img-preview">` : "";
    html += `
    <div class="record-item">
      <div class="date-text">${r.date}</div>
      <div>学习时长：${r.time}</div>
      <div>学习内容：${r.content}</div>
      <div>今日总结：${r.summary}</div>
      ${imgHtml}
    </div>`;
  });
  document.getElementById("recordList").innerHTML = html;
}

// 提交打卡
function checkIn() {
  const today = new Date().toLocaleDateString();
  const hasToday = records.some(r => r.date.startsWith(today));
  if (hasToday) {
    alert("你今天已经打卡过啦，明天再来～");
    return;
  }

  const time = document.getElementById("time").value;
  const content = document.getElementById("content").value.trim();
  const summary = document.getElementById("summary").value.trim();
  if (!content) {
    alert("请填写今日学习内容");
    return;
  }

  records.unshift({
    date: new Date().toLocaleString(),
    time,
    content,
    summary,
    img: imgBase64
  });
  localStorage.setItem("studyRecords", JSON.stringify(records));
  render();

  // 清空
  document.getElementById("content").value = "";
  document.getElementById("summary").value = "";
  document.getElementById("imgInput").value = "";
  document.getElementById("preview").style.display = "none";
  imgBase64 = "";

  alert("✅ 打卡成功！已保存");
}

render();
</script>
</body>
</html>
